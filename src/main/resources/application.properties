spring.application.name=quiz

# --- Koneksi PostgreSQL (sesuaikan username & password kamu) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/Quiz_PBO
spring.datasource.username=postgres
spring.datasource.password=12345678

# Tabel dibuat manual lewat database.sql, jadi Hibernate tidak perlu membuat tabel
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

server.error.include-message=always
server.error.include-stacktrace=always
server.servlet.session.tracking-modes=cookie